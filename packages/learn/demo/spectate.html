<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectator view</title>
<style>
  :root { --bg: #fbfaf7; --fg: #1d1b18; --muted: #6f6a62; --line: #e4e0d8; --card: #ffffff; --chip: #f2efe9; --accent: #c2410c; --hidden: #8a6fd1; --after: #1f8a70; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161a; --fg: #ece9e3; --muted: #9a958c; --line: #2c2c33; --card: #1e1e24; --chip: #2a2a31; --accent: #f08a4b; --hidden: #a991e8; --after: #3fbf98; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-size: 18px; margin: 0; }
  .sub { color: var(--muted); margin: 2px 0 14px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .name { font-weight: 650; font-size: 15px; }
  .score { font-variant-numeric: tabular-nums; font-weight: 650; }
  .moving { color: var(--accent); font-size: 12px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 8px; }
  .chip { background: var(--chip); border-radius: 6px; padding: 2px 8px; font-size: 13px; white-space: nowrap; }
  .chip.down { border: 1px dashed var(--hidden); color: var(--hidden); }
  .chip.up { border: 1px solid var(--accent); }
  .muted { color: var(--muted); }
  .pile { display: grid; grid-template-columns: 150px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .pile:last-child { border-bottom: 0; }
  .log { font-size: 13px; max-height: 70vh; overflow-y: auto; }
  .log div { padding: 1px 0; }
  .log .heading { font-weight: 650; margin-top: 6px; }
  .eval { font-variant-numeric: tabular-nums; }
  select { font: inherit; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
</style>
</head>
<body>
<main>
  <div class="row"><h1>Spectator view</h1><span class="muted">local only · <a href="/" style="color:inherit">bot insight</a> · <select id="room"></select></span></div>
  <div class="sub" id="sub">Waiting for a game…</div>
  <div class="grid">
    <div>
      <div id="players"></div>
      <div class="card"><div class="label">Piles (top first)</div><div id="piles"></div></div>
      <div class="card"><div class="label">Discard (oldest first)</div><div class="chips" id="discard"></div></div>
    </div>
    <div>
      <div class="card"><div class="label">Bot's last evaluation</div><div id="bot" class="eval muted">–</div></div>
      <div class="card"><div class="label">Log (everything, unredacted)</div><div class="log" id="log"></div></div>
    </div>
  </div>
</main>
<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const coins = (half) => (half === null || half === undefined ? '–' : (half / 2).toString());
const pct = (x) => (x === null || x === undefined ? '–' : `${Math.round(100 * x)}%`);
let chosenRoom = null, lastLog = '';
document.getElementById('room').onchange = (e) => { chosenRoom = e.target.value || null; refresh(); };

async function refresh() {
  let d;
  try { d = await (await fetch('/spectate.json' + (chosenRoom ? `?room=${chosenRoom}` : ''))).json(); } catch { return; }
  const sel = document.getElementById('room');
  sel.innerHTML = d.rooms.map((r) => `<option ${r === d.room ? 'selected' : ''}>${esc(r)}</option>`).join('') || '<option>no game</option>';
  if (!d.room) return;
  const moving = new Set(d.toMove.map((m) => m.seat));
  document.getElementById('sub').textContent =
    `Room ${d.room} · round ${d.round}, turn ${d.turn} · ${d.phase} · marks ${d.players.map((p) => `${p.name ?? 'seat ' + p.seat} ${d.marks[p.seat]}`).join(', ')} (first to ${d.marksToWin})`;
  document.getElementById('players').innerHTML = d.players.map((p) => `
    <div class="card">
      <div class="row"><span class="name">${esc(p.name ?? 'seat ' + p.seat)} <span class="muted">· seat ${p.seat}</span></span>
        <span>${moving.has(p.seat) ? `<span class="moving">to move: ${esc(d.toMove.find((m) => m.seat === p.seat).kind)}</span> · ` : ''}<span class="score">${coins(p.score)} coins</span></span></div>
      <div class="label" style="margin-top:6px">Keep</div>
      <div class="chips">${p.keep.map((c) => `<span class="chip ${c.faceDown ? 'down' : ''}" title="${c.faceDown ? 'face down' : ''}">${esc(c.name)}</span>`).join('') || '<span class="muted">empty</span>'}</div>
      <div class="label">Hand</div>
      <div class="chips">${p.hand.map((c) => `<span class="chip">${esc(c)}</span>`).join('') || '<span class="muted">empty</span>'}</div>
    </div>`).join('');
  document.getElementById('piles').innerHTML = d.piles.map((pile) => `
    <div class="pile"><div><b>${esc(pile.identity)}</b> <span class="muted">· in front of ${esc(pile.owner ?? 'ghost ' + pile.position)} · ${pile.cards.length}</span></div>
      <div class="chips" style="margin:0">${pile.cards.map((c) => `<span class="chip ${c.faceUp ? 'up' : ''}" title="${c.faceUp ? 'face up' : ''}">${esc(c.name)}</span>`).join('') || '<span class="muted">empty</span>'}</div></div>`).join('');
  document.getElementById('discard').innerHTML = d.discard.map((c) => `<span class="chip">${esc(c)}</span>`).join('') || '<span class="muted">empty</span>';
  const b = d.bot;
  document.getElementById('bot').innerHTML = b
    ? `turn ${b.turn}, ${esc(b.kind)}: before search <b>${pct(b.before)}</b> · after search <b style="color:var(--after)">${pct(b.after)}</b>${b.moves.length ? ` · played <b>${esc(b.moves.find((m) => m.chosen)?.move ?? '?')}</b> (${b.moves.length} moves × ${b.worlds} worlds, ${(b.ms / 1000).toFixed(1)} s)` : ' (one legal move)'}`
    : '–';
  const logHtml = d.log.map((l) => `<div class="${l.heading ? 'heading' : ''}" style="padding-left:${l.depth * 14}px">${esc(l.text)}</div>`).join('');
  if (logHtml !== lastLog) {
    const el = document.getElementById('log');
    const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
    el.innerHTML = logHtml;
    lastLog = logHtml;
    if (atBottom) el.scrollTop = el.scrollHeight;
  }
}
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
