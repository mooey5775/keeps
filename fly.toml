# Fly.io deployment. Rooms live in the server's memory, so this app must run
# on exactly one machine: deploy with `fly deploy --ha=false`, and never scale
# it above one machine.

app = "keeps-online"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleep when nobody is connected (open game connections keep it awake);
  # the next visit wakes it in a second or two. Idle rooms are lost on sleep.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
