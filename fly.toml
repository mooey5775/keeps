# Fly.io deployment. Rooms live in the server's memory, so this app must run
# on exactly one machine: deploy with `fly deploy --ha=false`, and never scale
# it above one machine.

app = "keeps-online"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # The bot's site, midstrike.playkeeps.online, is this one now: its pages are sent here (its WebSocket still served).
  SITE_URL = "https://playkeeps.online"
  REDIRECT_HOSTS = "midstrike.playkeeps.online"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleep when nobody is connected (open game connections keep it awake).
  # "suspend" freezes the running server, memory and all, so empty rooms
  # survive the sleep (until the server's own 2-hour cleanup), and the next
  # visit resumes it in well under a second. Deploys still start fresh.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    # (Loading Midstrike's network takes a few seconds.)
    grace_period = "15s"

# Saved games and the session log (KEEPS_DATA_DIR) live on a volume, so they survive redeploys and restarts. Create
# it once: fly volumes create keeps_data --size 1 -r sjc -a keeps-online
[mounts]
  source = "keeps_data"
  destination = "/app/data"

# Midstrike's searching and reviews run on gpu03 (see the Dockerfile): this machine serves the games and holds the
# network and the reviews' bookkeeping, for which 2 GB is ample.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
