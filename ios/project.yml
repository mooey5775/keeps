# The iOS spike: Midstrike's search on the phone (ios/README.md). XcodeGen makes the Xcode project from this file;
# the project itself isn't kept (ios/sync.sh generates it on the Mac).
name: KeepsSpike
options:
  bundleIdPrefix: online.playkeeps
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: F24KS6J4BV
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  KeepsSpike:
    type: application
    platform: iOS
    sources:
      - path: Spike
      # The page, its workers, the weights and the benchmark positions, built by sync.sh: served by the keeps:// scheme.
      - path: build/web
        type: folder
        buildPhase: resources
      # Made on the Mac by bot/keeps_bot/coreml.py (sync.sh); Xcode compiles it to KeepsPolicy.mlmodelc.
      - path: build/KeepsPolicy.mlpackage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.playkeeps.KeepsSpike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Keeps Spike
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
