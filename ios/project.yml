# The iOS app (Keeps) and its tests (KeepsTests, KeepsUITests: ios/test.sh). XcodeGen makes the Xcode project from this file;
# the project itself isn't kept (ios/sync.sh generates it on the Mac).
name: Keeps
options:
  bundleIdPrefix: online.playkeeps
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: F24KS6J4BV
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Keeps:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      # The core (ios/core, bundled by sync.sh) and the network's weights: served by the keeps:// scheme.
      - path: build/core
        type: folder
        buildPhase: resources
      # The card pictures and the fonts (sync.sh copies them from the website, and ios/Fonts).
      - path: build/cards
        type: folder
        buildPhase: resources
      - path: build/fonts
        type: folder
        buildPhase: resources
      # Made on the Mac by training/keeps_bot/coreml.py (sync.sh); Xcode compiles it to KeepsPolicy.mlmodelc.
      - path: build/KeepsPolicy.mlpackage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.playkeeps.Keeps
        GENERATE_INFOPLIST_FILE: YES
        # The version people see, and the build's number (ios/sync.sh gives it the commit count, so each build's is new).
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # App/AppIcon.icon: an Icon Composer document (Liquid Glass: the system draws its light, dark, tinted and clear looks).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Keeps
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # The table is laid out for a phone held upright (the wide layout comes later); an iPad turns any way.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        # Internal.swift: the KEEPS_* switches and the inspectable core, in Debug (the tests') and in sync.sh's builds.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG INTERNAL
  KeepsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared/Protocol.swift
      - path: Shared/Choosing.swift
      # Messages of whole games, both ways, recorded by ios/tools/swift-types/goldens.ts (ios/test.sh).
      - path: build/goldens
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.playkeeps.KeepsTests
        GENERATE_INFOPLIST_FILE: YES
  KeepsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Keeps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.playkeeps.KeepsUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Keeps
schemes:
  KeepsTests:
    build:
      targets:
        KeepsTests: [test]
        KeepsUITests: [test]
    test:
      targets: [KeepsTests, KeepsUITests]
