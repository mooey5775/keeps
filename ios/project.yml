# The iOS app (Keeps), its tests (KeepsTests: ios/test.sh) and the spike that measured it (KeepsSpike). XcodeGen makes the Xcode project from this file;
# the project itself isn't kept (ios/sync.sh generates it on the Mac).
name: Keeps
options:
  bundleIdPrefix: online.playkeeps
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: F24KS6J4BV
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Keeps:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      # The core (ios/core, bundled by sync.sh) and the network's weights: served by the keeps:// scheme.
      - path: build/core
        type: folder
        buildPhase: resources
      # Made on the Mac by bot/keeps_bot/coreml.py (sync.sh); Xcode compiles it to KeepsPolicy.mlmodelc.
      - path: build/KeepsPolicy.mlpackage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.playkeeps.Keeps
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Keeps
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
  KeepsSpike:
    type: application
    platform: iOS
    sources:
      - path: Spike
      - path: Shared
      # The spike's page, its workers, the weights and the benchmark positions, built by sync.sh.
      - path: build/web
        type: folder
        buildPhase: resources
      - path: build/KeepsPolicy.mlpackage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.playkeeps.KeepsSpike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Keeps Spike
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
  KeepsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared/Protocol.swift
      # Messages of whole games, both ways, recorded by ios/tools/swift-types/goldens.ts (ios/test.sh).
      - path: build/goldens
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.playkeeps.KeepsTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KeepsTests:
    build:
      targets:
        KeepsTests: [test]
    test:
      targets: [KeepsTests]
