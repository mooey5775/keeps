# Midstrike on Fly.io: the search bot's own app (midstrike.playkeeps.online), separate from the
# production site (fly.toml). Rooms live in the server's memory, so this app must run on exactly
# one machine: deploy with `fly deploy -c fly.midstrike.toml --ha=false`, and never scale it above one.

app = "keeps-midstrike"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.midstrike"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Stop when nobody is connected (open game connections keep it running): the 16-core machine is
  # paid for only while people play. It can't suspend (that needs 2 GB of memory or less); a stopped
  # machine starts again on the next visit in about a second.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

# Saved games and the session log (KEEPS_DATA_DIR) live on a volume, so they survive redeploys and
# restarts. Create it once: fly volumes create midstrike_data --size 1 -r sjc -a keeps-midstrike
[mounts]
  source = "midstrike_data"
  destination = "/app/data"

# The search plays every legal move out in 128 sampled worlds at each decision (512 took about 14 s
# on these 16 dedicated cores), for the bot's moves and for training mode's advice.
[[vm]]
  size = "performance-16x"
