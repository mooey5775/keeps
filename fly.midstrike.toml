# Midstrike on Fly.io: the search bot's own app (midstrike.playkeeps.online), separate from the
# production site (fly.toml). Rooms live in the server's memory, so this app must run on exactly
# one machine: deploy with `fly deploy -c fly.midstrike.toml --ha=false`, and never scale it above one.

app = "keeps-midstrike"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.midstrike"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Stop when nobody is connected (open game connections keep it running). In practice it stays up: gpu03's
  # remote worker polls it for work all the time, which is fine on this small machine.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

# Saved games and the session log (KEEPS_DATA_DIR) live on a volume, so they survive redeploys and
# restarts. Create it once: fly volumes create midstrike_data --size 1 -r sjc -a keeps-midstrike
[mounts]
  source = "midstrike_data"
  destination = "/app/data"

# The searching and the round reviews run on gpu03 (Dockerfile.midstrike): this machine only serves the
# games, so a small one does.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
