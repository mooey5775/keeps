# Midstrike on Fly.io: the search bot's own app (midstrike.playkeeps.online), separate from the
# production site (fly.toml). Rooms live in the server's memory, so this app must run on exactly
# one machine: deploy with `fly deploy -c fly.midstrike.toml --ha=false`, and never scale it above one.

app = "keeps-midstrike"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.midstrike"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleep when nobody is connected (open game connections keep it awake). "suspend" freezes the
  # running server, memory and all, and resumes it on the next visit in well under a second (only
  # machines with 2 GB of memory or less can suspend).
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

# The bot plays its network directly (SEARCH=off), and training mode's suggestions are a few hundred
# network passes per decision: a small shared machine is plenty. (The search needed performance-16x:
# about 14 s per decision at 512 worlds.)
[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
